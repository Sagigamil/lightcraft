name: Android MobileSAM build

# MobileSAM needs the Qualcomm QNN SDK and the two compiled context binaries. Neither is in
# the repository (licence and size), so this manual workflow downloads them and builds the
# MobileSAM APK. The regular Android CI builds Lite; SAM 3 is not built here.
#
# Required repository secret:
#   MOBILESAM_CTX_URL  a zip with encoder_ctx.bin and decoder8m_cpu.bin at its root
#
# The QNN SDK is downloaded from Qualcomm's public software centre (2.50.0.260828, the version
# the contexts were compiled with). See docs/ANDROID_APKS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-mobilesam-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  ANDROID_NDK_VERSION: "28.2.13676358"
  QNN_SDK_URL: "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip"

jobs:
  build-mobilesam:
    name: Build MobileSAM APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Setup Android SDK and NDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            New-Item -ItemType Directory -Force (Join-Path $sdk "cmdline-tools") | Out-Null
            Invoke-WebRequest "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile cmdline-tools.zip
            Expand-Archive cmdline-tools.zip -DestinationPath (Join-Path $sdk "cmdline-tools") -Force
            Move-Item (Join-Path $sdk "cmdline-tools\cmdline-tools") (Join-Path $sdk "cmdline-tools\latest") -Force
            $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          }
          ("y`n" * 20) | & $sdkmanager --licenses --sdk_root="$sdk" | Out-Null
          & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;$env:ANDROID_NDK_VERSION" --sdk_root="$sdk"
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-android-mobilesam

      - name: Restore the QNN SDK cache
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: D:\qnn-sdk
          key: qnn-sdk-2.50.0.260828-v1

      - name: Fetch the QNN SDK
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "D:\qnn-sdk.zip"
          curl.exe -sS -L -A "Mozilla/5.0" --retry 3 --retry-delay 5 -o $zip $env:QNN_SDK_URL
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1GB) {
            throw "The QNN SDK download failed or is truncated: $zip"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName -notmatch '/(include/QNN/|lib/aarch64-android/|lib/hexagon-v81/unsigned/)') { continue }
              $rel = $entry.FullName -replace '^.*?/(include/QNN/|lib/aarch64-android/|lib/hexagon-v81/unsigned/)', '$1'
              $dest = Join-Path "D:\qnn-sdk" $rel
              if ($entry.Name -eq '') {
                New-Item -ItemType Directory -Force $dest | Out-Null
              } else {
                New-Item -ItemType Directory -Force (Split-Path $dest -Parent) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
              }
            }
          } finally { $archive.Dispose() }
          Remove-Item $zip -Force
          if (-not (Test-Path "D:\qnn-sdk\include\QNN\QnnInterface.h")) {
            throw "The QNN SDK has no include/QNN/QnnInterface.h."
          }

      - name: Point the build at the QNN SDK
        shell: pwsh
        run: |
          "QNN_SDK_ROOT=D:\qnn-sdk" >> $env:GITHUB_ENV

      - name: Fetch the MobileSAM contexts
        shell: pwsh
        env:
          MOBILESAM_CTX_URL: ${{ secrets.MOBILESAM_CTX_URL }}
        run: |
          if (-not $env:MOBILESAM_CTX_URL) {
            throw "Add the MOBILESAM_CTX_URL repository secret: a zip with encoder_ctx.bin and decoder8m_cpu.bin (see docs/ANDROID_APKS.md)."
          }
          $zip = Join-Path $env:RUNNER_TEMP "mobilesam-ctx.zip"
          Invoke-WebRequest -Uri $env:MOBILESAM_CTX_URL -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP "mobilesam-ctx"
          Expand-Archive $zip -DestinationPath $out -Force
          New-Item -ItemType Directory -Force "tools\ai\mobilesam\ctx" | Out-Null
          Copy-Item (Join-Path $out "encoder_ctx.bin") "tools\ai\mobilesam\ctx\encoder_ctx.bin" -Force
          Copy-Item (Join-Path $out "decoder8m_cpu.bin") "tools\ai\mobilesam\decoder8m_cpu.bin" -Force

      - name: Build the MobileSAM APK
        shell: pwsh
        run: .\android\build.ps1 -Edition MobileSAM -Configuration Release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-mobilesam-${{ github.sha }}
          path: android/dist/Lightcraft-MobileSAM.apk
          retention-days: 14

      - name: Publish the latest MobileSAM APK
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "android-mobilesam-latest"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease `
              --title "MobileSAM (latest)" `
              --notes "Latest MobileSAM APK built from main. Updated automatically."
          }
          gh release upload $tag android/dist/Lightcraft-MobileSAM.apk --clobber --repo $env:GITHUB_REPOSITORY
