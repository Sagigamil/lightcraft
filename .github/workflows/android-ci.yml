name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  ANDROID_NDK_VERSION: "28.2.13676358"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        run: |
          mkdir -p android-sdk/cmdline-tools
          cd android-sdk/cmdline-tools
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          yes | latest/bin/sdkmanager --licenses --sdk_root="$GITHUB_WORKSPACE/android-sdk" || true
          latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION" --sdk_root="$GITHUB_WORKSPACE/android-sdk"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/opt/hostedtoolcache/Java_Microsoft_jdk/17.0.19/x64" >> "$GITHUB_ENV"
        env:
          ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-android

      - name: Build Rust library
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CC_aarch64-linux-android: ${{ github.workspace }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          CXX_aarch64-linux-android: ${{ github.workspace }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ github.workspace }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
        run: |
          cargo build --locked -p lightcraft-android --target aarch64-linux-android --release

      - name: Prepare native library
        run: |
          bin="${{ github.workspace }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblightcraft_android.so android/app/src/main/jniLibs/arm64-v8a/
          "$bin/llvm-strip" --strip-debug android/app/src/main/jniLibs/arm64-v8a/liblightcraft_android.so

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PandroidAbi=arm64-v8a --console=plain

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-android-arm64-v8a
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="android-$(date +%Y%m%d-%H%M%S)"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          gh release create "$tag" \
            --title "LightCraft Android (build $tag)" \
            --notes "Automatic build from main branch. SHA: ${GITHUB_SHA::9}" \
            "$apk"
